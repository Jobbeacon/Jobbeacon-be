spring:
  application:
    name: jobbeacon-be
  profiles:
    active: ${PROFILE_ACTIVE:local}
  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: classpath:/db/changelog/db.changelog-master.xml

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/job_platform}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  jackson:
    property-naming-strategy: SNAKE_CASE

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # RabbitMQ closes the channel when a delivered message is not acked within 30 minutes, and the prefetched ones
        # waiting their turn count too. A posting takes about 10s, so the default of 250 does not fit.
        prefetch: ${RABBITMQ_PREFETCH:5}

app:
  job-dedup:
    enabled: ${JOB_DEDUP_ENABLED:true}
    window-days: ${JOB_DEDUP_WINDOW_DAYS:30}
    jaccard-threshold: ${JOB_DEDUP_JACCARD_THRESHOLD:0.8}
    title-threshold: ${JOB_DEDUP_TITLE_THRESHOLD:0.8}
    salary-tolerance: ${JOB_DEDUP_SALARY_TOLERANCE:0.5}
    high-content-threshold: ${JOB_DEDUP_HIGH_CONTENT_THRESHOLD:0.9}
    relaxed-title-threshold: ${JOB_DEDUP_RELAXED_TITLE_THRESHOLD:0.3}
    no-title-threshold: ${JOB_DEDUP_NO_TITLE_THRESHOLD:0.95}
    containment-threshold: ${JOB_DEDUP_CONTAINMENT_THRESHOLD:0.85}
    containment-title-threshold: ${JOB_DEDUP_CONTAINMENT_TITLE_THRESHOLD:0.6}
    containment-min-shingles: ${JOB_DEDUP_CONTAINMENT_MIN_SHINGLES:100}
    short-text-shingles: ${JOB_DEDUP_SHORT_TEXT_SHINGLES:100}
  geocode:
    enabled: true
    base-url: https://nominatim.openstreetmap.org/search
    user-agent: jobbeacon-be/1.0 (address normalization)
    min-interval: 1s
    timeout: 15s
    positive-ttl: 180d
    negative-ttl: 7d
  rabbitmq:
    job-posting:
      queue: job-posting.parsed
  admin:
    # Emails promoted to ADMIN when they sign in (comma separated). Used to bootstrap the first admin.
    emails: ${APP_ADMIN_EMAILS:}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-2}
    embedding-dimension: ${GEMINI_EMBEDDING_DIMENSION:1536}
    # Best first. Gemini 2.5 cannot be mixed with Gemini 3 here: its function calls in a chat have no thought signature.
    chat-models: ${GEMINI_CHAT_MODELS:gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemma-4-26b-a4b-it,gemma-4-31b-it}
    # Limit of one request, retries not included. Chat and CV extraction have their own.
    request-timeout: ${GEMINI_REQUEST_TIMEOUT:30s}
    # Background calls start no new request, on any model or key, after this.
    total-timeout: ${GEMINI_TOTAL_TIMEOUT:90s}
    retry:
      max-retries: ${GEMINI_RETRY_MAX_RETRIES:5}
      initial-delay-ms: ${GEMINI_RETRY_INITIAL_DELAY_MS:2000}
      multiplier: ${GEMINI_RETRY_MULTIPLIER:2.0}
  chat:
    session-ttl: ${CHAT_SESSION_TTL:30m}
    history-token-budget: ${CHAT_HISTORY_TOKEN_BUDGET:6000}
    chars-per-token: ${CHAT_CHARS_PER_TOKEN:3.0}
    min-history-turns: ${CHAT_MIN_HISTORY_TURNS:2}
    max-output-tokens: ${CHAT_MAX_OUTPUT_TOKENS:1500}
    thinking-level: ${CHAT_THINKING_LEVEL:low}
    thinking-budget: ${CHAT_THINKING_BUDGET:}
    request-timeout: ${CHAT_REQUEST_TIMEOUT:20s}
    turn-deadline: ${CHAT_TURN_DEADLINE:45s}
    retry:
      max-retries: ${CHAT_RETRY_MAX_RETRIES:1}
      initial-delay-ms: ${CHAT_RETRY_INITIAL_DELAY_MS:500}
      multiplier: ${CHAT_RETRY_MULTIPLIER:2.0}
    search:
      default-size: ${CHAT_SEARCH_DEFAULT_SIZE:6}
      max-size: ${CHAT_SEARCH_MAX_SIZE:10}
    detail:
      description-max-chars: ${CHAT_DETAIL_DESCRIPTION_MAX_CHARS:2000}
      benefits-max-chars: ${CHAT_DETAIL_BENEFITS_MAX_CHARS:800}
    stream:
      sse-timeout: ${CHAT_STREAM_SSE_TIMEOUT:60s}
      shutdown-grace: ${CHAT_STREAM_SHUTDOWN_GRACE:10s}
  category-classification:
    # Path of category_embeddings.json on disk (in Docker: the mounted file). Empty: read it from the classpath.
    embeddings-file: ${CATEGORY_EMBEDDINGS_FILE:}
    min-score: ${CATEGORY_CLASSIFICATION_MIN_SCORE:0.72}
    min-margin: ${CATEGORY_CLASSIFICATION_MIN_MARGIN:0.03}
  # Comparing candidates with jobs by meaning, for recommendations: both are embedded in the background. Off: no
  # embedding, and recommendations go by the graph and by title words only.
  semantic-matching:
    enabled: ${SEMANTIC_MATCHING_ENABLED:true}
    interval: ${SEMANTIC_MATCHING_INTERVAL:PT30S}
    # Candidates and jobs embedded per run, each.
    batch-size: ${SEMANTIC_MATCHING_BATCH_SIZE:50}
  skill-resolution:
    min-similarity: ${SKILL_RESOLUTION_MIN_SIMILARITY:0.7}
    top-k: ${SKILL_RESOLUTION_TOP_K:10}
  elasticsearch:
    url: ${ELASTICSEARCH_URL:http://localhost:9200}
    index: ${ELASTICSEARCH_JOB_INDEX:jobs}
  market:
    # VND per USD. A fixed rate: update it when the exchange rate moves a lot.
    usd-vnd-rate: ${MARKET_USD_VND_RATE:25000}
    # Below this many salaried jobs a group shows no salary figures, only its job count.
    min-salary-sample: ${MARKET_MIN_SALARY_SAMPLE:5}
  search:
    backfill-on-startup: ${SEARCH_BACKFILL_ON_STARTUP:false}

server:
  port: ${PORT:8080}
  servlet:
    context-path: /jobbeacon-be
  
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.jobbeacon: INFO

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true