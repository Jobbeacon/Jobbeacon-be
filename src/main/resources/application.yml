spring:
  application:
    name: jobbeacon-be
  profiles:
    active: ${PROFILE_ACTIVE:local}

  datasource:
    url: ${DB_URL:jdbc:h2:mem:jobbeacon;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: ${PORT:8080}

logging:
  level:
    com.jobbeacon: INFO
